schema: 1
revision: 17
refs:
  viewLink:
    - op: select
      css: figcaption a[href^="/view/"]
  userLink:
    - op: select
      css: figcaption a[href^="/user/"]
  urlName:
    - op: attr
      name: href
    - op: regex
      pattern: /user/([^/]+)
  statsText:
    - op: select
      css: >-
        div.userpage-section-left div.table:not(#userpage-contact-item),
        div.userpage-section-right div.table:not(#userpage-contact-item)
    - op: text
enums:
  SubmissionRating:
    feature: submission
    description: The content rating the site assigns to a submission.
    values: [general, mature, adult]
  SubmissionType:
    feature: submission
    description: The kind of content a submission holds.
    values: [image, text, audio, flash]

types:
  submissionPreview:
    feature: submission
    description: A submission as it appears in a listing.
    fields:
      id:
        description: The submission's numeric identifier.
        presence: required
        type: int
        read:
          - - op: attr
              name: id
            - op: regex
              pattern: sid[-_](\d+)
      rating:
        description: The submission's content rating.
        presence: required
        type: SubmissionRating
        read:
          - - op: class
              prefix: r-
      type:
        description: Content type, such as image, text, music or flash.
        type: SubmissionType
        read:
          - - op: class
              prefix: t-
      title:
        description: |-
          Listing titles are sanitised by the site and may lose leading
          punctuation. The submission page carries the canonical title.
        presence: expected
        read:
          - - $ref: viewLink
            - op: attr
              name: title
            - op: trim
          - - $ref: viewLink
            - op: text
            - op: trim
          - - op: select
              css: img
            - op: attr
              name: title
            - op: trim
      uploader:
        description: |-
          The url form of the name of whoever posted the submission,
          lowercased and with underscores removed.
        presence: required
        read:
          - - $ref: userLink
            - $ref: urlName
          - - op: attr
              name: data-user
            - op: regex
              pattern: u-(.+)
          - - op: class
              prefix: u-
          - - op: select
              css: img
            - op: attr
              name: data-tags
            - op: regex
              pattern: (?:^|\s)u_(\S+)
      uploaderName:
        description: The name of whoever posted the submission, as displayed.
        read:
          - - $ref: userLink
            - op: text
            - op: trim
      link:
        description: Absolute url of the submission page.
        presence: required
        read:
          - - op: select
              css: a[href^="/view/"]
            - op: attr
              name: href
            - op: url
      thumbnail:
        description: |-
          Absolute url of the thumbnail. The size segment constrains the
          longest edge to that many pixels.
        presence: required
        read:
          - - op: select
              css: img
            - op: attr
              name: src
            - op: url
      thumbnailWidth:
        description: |-
          Thumbnail width in pixels, as declared by the site rather than
          measured from the image.
        type: float
        read:
          - - op: select
              css: img
            - op: attr
              name: data-width
      thumbnailHeight:
        description: Thumbnail height in pixels, which the site fixes at 200.
        type: float
        read:
          - - op: select
              css: img
            - op: attr
              name: data-height

  favorite:
    feature: submission
    fields:
      id:
        description: Identifies the favourite, and is what the next page continues after.
        presence: required
        type: int
        read:
          - - op: attr
              name: data-fav-id
      submission:
        presence: required
        type: submissionPreview
        at: [self]

  comment:
    feature: comment
    description: A comment on a submission or a journal.
    fields:
      id:
        description: The comment's numeric identifier.
        presence: required
        type: int
        read:
          - - op: select
              css: a.comment_anchor[id^="cid:"]
            - op: attr
              name: id
            - op: regex
              pattern: cid:(\d+)
      posted:
        description: When the comment was posted.
        presence: expected
        type: timestamp
        read:
          - - op: attr
              name: data-timestamp
      author:
        description: |-
          The url form of the commenter name, lowercased and with
          underscores removed.
        read:
          - - op: select
              css: a.c-usernameBlock__userName
            - $ref: urlName
      authorName:
        description: The commenter name as displayed.
        read:
          - - op: select
              css: a.c-usernameBlock__displayName span
            - op: text
            - op: trim
      authorAvatar:
        description: Absolute url of the commenter's avatar.
        read:
          - - op: select
              css: img.comment_useravatar
            - op: attr
              name: src
            - op: url
      body:
        description: The rendered comment, as markup rather than text.
        read:
          - - op: select
              css: comment-user-text div.user-submitted-links
            - op: html
      width:
        description: |-
          The percentage width the site renders the comment at.
          Replies are narrower than their parent, so this encodes depth.
        presence: expected
        type: int
        read:
          - - op: attr
              name: style
            - op: regex
              pattern: width:\s*(\d+)

  folder:
    feature: submission
    fields:
      user:
        description: The url name of the member who owns the folder.
        presence: required
        read:
          - - op: attr
              name: href
            - op: regex
              pattern: ^/gallery/([^/]+)/folder/
      id:
        presence: required
        type: int
        read:
          - - op: attr
              name: href
            - op: regex
              pattern: /folder/(\d+)/
      slug:
        description: |-
          The folder name as FA writes it into the url. FA routes by the id
          alone, and writes a placeholder for names it cannot transliterate.
        presence: required
        read:
          - - op: attr
              name: href
            - op: regex
              pattern: /folder/\d+/([^/]+)
      name:
        presence: required
        read:
          - - op: text
            - op: replace
              pattern: \s+
              with: ' '
            - op: trim
      count:
        description: |-
          Counts every rating, so it exceeds what a listing shows a reader
          whose settings hide some of them.
        presence: expected
        type: int
        read:
          - - op: attr
              name: title
            - op: regex
              pattern: (\d+) submission
      group:
        description: |-
          The heading the member filed the folder under. Only the gallery
          sidebar carries it, and folders outside any heading have none.
        read:
          - - op: closest
              css: ul
            - op: previous
              css: div.container-item-top
            - op: select
              css: h4
            - op: text
            - op: trim

  folderRow:
    feature: submission
    description: |-
      A row in the gallery sidebar. FA renders the open folder as plain text
      without a link, so that row carries no user, id or slug.
    fields:
      user:
        read:
          - - op: attr
              name: href
            - op: regex
              pattern: ^/gallery/([^/]+)/folder/
      id:
        type: int
        read:
          - - op: attr
              name: href
            - op: regex
              pattern: /folder/(\d+)/
      slug:
        read:
          - - op: attr
              name: href
            - op: regex
              pattern: /folder/\d+/([^/]+)
      name:
        presence: required
        read:
          - - op: text
            - op: replace
              pattern: \s+
              with: ' '
            - op: trim
      count:
        presence: expected
        type: int
        read:
          - - op: attr
              name: title
            - op: regex
              pattern: (\d+) submission
      group:
        read:
          - - op: closest
              css: ul
            - op: previous
              css: div.container-item-top
            - op: select
              css: h4
            - op: text
            - op: trim

  miniGallery:
    feature: submission
    description: The strip of neighbouring submissions on a submission page.
    fields:
      name:
        description: Which listing the neighbours come from, such as the main gallery.
        presence: required
        read:
          - - op: select
              css: div.minigallery-title a
            - op: text
            - op: trim
      link:
        presence: required
        read:
          - - op: select
              css: div.minigallery-title a
            - op: attr
              name: href
            - op: url
      count:
        description: Scraps carry no count.
        type: int
        read:
          - - op: select
              css: div.minigallery-title i
            - op: text
            - op: regex
              pattern: (\d+)
      newer:
        type: submissionPreview
        list: true
        at: ['> div:first-child:not(.minigallery-title) figure[id^="sid_"]']
      older:
        type: submissionPreview
        list: true
        at: ['> div.minigallery-title ~ div figure[id^="sid_"]']

  submission:
    feature: submission
    description: A submission as its own page carries it.
    fields:
      id:
        description: The submission's numeric identifier.
        presence: required
        type: int
        read:
          - - op: select
              css: script[data-content-id]
            - op: attr
              name: data-content-id
      title:
        description: The submission's title, free of the padding the page markup adds.
        presence: required
        read:
          - - op: select
              css: script[data-content-id]
            - op: attr
              name: data-artwork-title
          - - op: select
              css: div.submission-title h2
            - op: text
            - op: trim
      uploader:
        description: |-
          The url form of the name of whoever posted the submission,
          lowercased and with underscores removed.
        presence: required
        read:
          - - op: select
              css: script[data-content-id]
            - op: attr
              name: data-artist-name
      uploaderName:
        description: The name of whoever posted the submission, as displayed.
        presence: expected
        read:
          - - op: select
              css: span.c-usernameBlockSimple__displayName
            - op: text
            - op: trim
      uploaderAvatar:
        description: Absolute url of the avatar of whoever posted the submission.
        presence: expected
        read:
          - - op: select
              css: img.submission-user-icon
            - op: attr
              name: src
            - op: url
      rating:
        description: The submission's content rating.
        presence: required
        type: SubmissionRating
        read:
          - - op: select
              css: div.rating [class*="c-contentRating--"]
            - op: class
              prefix: c-contentRating--
          - - op: select
              css: '[class*="c-contentRating--"]'
            - op: class
              prefix: c-contentRating--
      type:
        description: The kind of content a submission holds.
        presence: expected
        type: SubmissionType
        read:
          - - op: select
              css: script[data-content-id]
            - op: attr
              name: data-content-type
      category:
        description: The kind of work, as the uploader filed it.
        presence: expected
        in: [div.submission-content-stats]
        read:
          - - op: labeled
              labels: span.highlight > span
              values: span:not(.highlight) > span
              label: Category
            - op: text
            - op: trim
      theme:
        description: The subject matter the uploader filed the work under.
        presence: expected
        in: [div.submission-content-stats]
        read:
          - - op: labeled
              labels: span.highlight > span
              values: span:not(.highlight) > span
              label: Theme
            - op: text
            - op: trim
      species:
        description: The species the uploader filed the work under.
        presence: expected
        in: [div.submission-content-stats]
        read:
          - - op: labeled
              labels: span.highlight > span
              values: span:not(.highlight) > span
              label: Species
            - op: text
            - op: trim
      resolution:
        description: The image's pixel dimensions, as FA renders them.
        in: [div.submission-content-stats]
        read:
          - - op: labeled
              labels: span.highlight > span
              values: span:not(.highlight) > span
              label: Resolution
            - op: text
            - op: trim
      fileSize:
        description: The size of the uploaded file, as FA renders it.
        in: [div.submission-content-stats]
        read:
          - - op: labeled
              labels: span.highlight > span
              values: span:not(.highlight) > span
              label: File Size
            - op: text
            - op: trim
      extension:
        description: The file's extension, without a leading dot.
        presence: expected
        read:
          - - op: select
              css: script[data-content-id]
            - op: attr
              name: data-content-extension
      posted:
        description: When the submission was posted.
        presence: expected
        type: timestamp
        read:
          - - op: select
              css: span.popup_date
            - op: attr
              name: data-time
      file:
        description: Absolute url of the submitted file at full resolution.
        presence: required
        read:
          - - op: select
              css: img#submissionImg
            - op: attr
              name: data-fullview-src
            - op: url
          - - op: select
              css: script[data-content-id]
            - op: attr
              name: data-content-url
            - op: url
      preview:
        description: Absolute url of a reduced copy of the submitted file.
        read:
          - - op: select
              css: img#submissionImg
            - op: attr
              name: data-preview-src
            - op: url
      description:
        description: The rendered description, as markup rather than text.
        read:
          - - op: select
              css: div.submission-description-text
            - op: html
      tags:
        description: Keywords the uploader attached to the submission.
        list: true
        at: ['span.tags a[href^="/search/"]']
        read:
          - - op: text
            - op: trim
      views:
        description: How many times the submission has been viewed.
        presence: expected
        type: int
        read:
          - - op: select
              css: div[title="Views"] > div
            - op: text
            - op: trim
      comments:
        description: How many comments the submission carries.
        presence: expected
        type: int
        read:
          - - op: select
              css: div[title="Comments"] > div
            - op: text
            - op: trim
      favorites:
        description: How many people have favourited the submission.
        presence: expected
        type: int
        read:
          - - op: select
              css: div[title="Favorites"] > div
            - op: text
            - op: trim
      favourited:
        description: Absent when signed out.
        type: bool
        in: [div#submission-options]
        read:
          - - op: select
              css: a[href^="/unfav/"]
            - op: literal
              value: 'true'
          - - op: select
              css: a[href^="/fav/"]
            - op: literal
              value: 'false'
      favouriteLink:
        description: |-
          Absolute url that adds or removes the submission from your
          favourites. The site only writes one of the two, so which it is
          says whether you have favourited it already. Absent when signed
          out.
        in: [div#submission-options]
        read:
          - - op: select
              css: a[href^="/fav/"], a[href^="/unfav/"]
            - op: attr
              name: href
            - op: url
      noteLink:
        description: |-
          Absolute url that opens a new note to whoever posted it. Absent
          when signed out.
        in: [div#submission-options]
        read:
          - - op: select
              css: a[href^="/newpm/"]
            - op: attr
              name: href
            - op: url

  submissionDocument:
    feature: submission
    page: true
    fields:
      submission:
        presence: required
        type: submission
        at: [body]
      miniGallery:
        type: miniGallery
        at: ['div#minigallery > section.minigallery-container:first-child']
      folders:
        type: folder
        list: true
        at: ['div.submission-folder a[href*="/folder/"]']
      comments:
        presence: expected
        type: comment
        list: true
        in: ['div#comments-submission']
        at: ['div.comment_container:not(.collapsed_height)']

  user:
    feature: user
    description: A member as their profile page carries them.
    fields:
      name:
        description: The url form of the name, lowercased and with underscores removed.
        presence: required
        read:
          - - op: select
              css: userpage-nav-avatar a
            - $ref: urlName
      displayName:
        description: The name as displayed.
        presence: expected
        read:
          - - op: select
              css: a.c-usernameBlock__displayName span
            - op: text
            - op: trim
      symbol:
        description: The account class the site marks the name with.
        read:
          - - op: select
              css: span.c-usernameBlock__symbol
            - op: attr
              name: title
      title:
        description: The one line the member writes under their name.
        read:
          - - op: select
              css: span.user-title
            - op: text
            - op: regex
              pattern: ^\s*(.+?)\s*\|
            - op: trim
      avatar:
        description: Absolute url of the avatar.
        presence: expected
        read:
          - - op: select
              css: userpage-nav-avatar img
            - op: attr
              name: src
            - op: url
      banner:
        description: Absolute url of the banner across the top of the profile.
        read:
          - - op: select
              css: site-banner picture img
            - op: attr
              name: src
            - op: url
      registered:
        description: When the account was made.
        presence: expected
        type: timestamp
        read:
          - - op: select
              css: span.user-title span.popup_date
            - op: attr
              name: data-time
      profile:
        description: The profile text, as markup rather than text.
        in: [section.userpage-layout-profile]
        read:
          - - op: select
              css: div.section-body.userpage-profile
            - op: html
      views:
        description: How many times the profile has been viewed.
        presence: expected
        type: int
        read:
          - - $ref: statsText
            - op: regex
              pattern: Views:\s*([0-9,]+)
            - op: replace
              pattern: ','
              with: ''
      submissions:
        description: How many submissions the member has posted.
        presence: expected
        type: int
        read:
          - - $ref: statsText
            - op: regex
              pattern: Submissions:\s*([0-9,]+)
            - op: replace
              pattern: ','
              with: ''
      favorites:
        description: How many submissions the member has favourited.
        presence: expected
        type: int
        read:
          - - $ref: statsText
            - op: regex
              pattern: Favs:\s*([0-9,]+)
            - op: replace
              pattern: ','
              with: ''
      commentsEarned:
        description: How many comments the member has received.
        presence: expected
        type: int
        read:
          - - $ref: statsText
            - op: regex
              pattern: (?:Comments|Cmts)(?:\s+Cmts)?\s+Earned:\s*([0-9,]+)
            - op: replace
              pattern: ','
              with: ''
      commentsMade:
        description: How many comments the member has written.
        presence: expected
        type: int
        read:
          - - $ref: statsText
            - op: regex
              pattern: (?:Comments|Cmts)(?:\s+Cmts)?\s+Made:\s*([0-9,]+)
            - op: replace
              pattern: ','
              with: ''
      journals:
        description: How many journals the member has posted.
        presence: expected
        type: int
        read:
          - - $ref: statsText
            - op: regex
              pattern: Journals:\s*([0-9,]+)
            - op: replace
              pattern: ','
              with: ''
      watchedBy:
        description: How many members watch this one.
        presence: expected
        type: int
        read:
          - - op: select
              css: section.watched-by-block
            - op: text
            - op: regex
              pattern: Watched by\s*([0-9,]+)
            - op: replace
              pattern: ','
              with: ''
      watching:
        description: How many members this one watches.
        presence: expected
        type: int
        read:
          - - op: select
              css: section.is-watching-block
            - op: text
            - op: regex
              pattern: Watching\s*([0-9,]+)
            - op: replace
              pattern: ','
              with: ''
      watched:
        type: bool
        read:
          - - op: select
              css: 'a#watch-button[href^="/unwatch/"]'
            - op: literal
              value: 'true'
          - - op: select
              css: 'a#watch-button[href^="/watch/"]'
            - op: literal
              value: 'false'
      watchKey:
        read:
          - - op: select
              css: a#watch-button
            - op: attr
              name: href
            - op: regex
              pattern: key=(\w+)

  contact:
    feature: user
    description: A way to reach a member, as listed on their profile.
    fields:
      kind:
        description: The service the entry points at.
        presence: required
        read:
          - - op: select
              css: img.contact-icon
            - op: class
              prefix: contact-icon-
      icon:
        description: Absolute url of the badge the site draws for the service.
        presence: expected
        read:
          - - op: select
              css: img.contact-icon
            - op: attr
              name: src
            - op: url
      label:
        description: The service name as the site writes it.
        presence: expected
        read:
          - - op: select
              css: div.user-contact-user-info strong
            - op: text
            - op: trim
      value:
        description: The handle or address the member gave.
        presence: required
        read:
          - - op: select
              css: div.user-contact-user-info a
            - op: text
            - op: trim
      link:
        description: |-
          Absolute url the entry points at, where the site made
          one. Handles the site cannot link carry no url.
        read:
          - - op: select
              css: div.user-contact-user-info a[href^="http"], div.user-contact-user-info a[href^="mailto"]
            - op: attr
              name: href

  shout:
    feature: user
    description: A message left on a member profile.
    fields:
      id:
        description: The message's numeric identifier.
        presence: required
        type: int
        read:
          - - op: select
              css: a.comment_anchor
            - op: attr
              name: id
            - op: regex
              pattern: shout-(\d+)
      author:
        description: The url form of the writer name.
        read:
          - - op: select
              css: a.c-usernameBlock__userName
            - $ref: urlName
      authorName:
        description: The writer name as displayed.
        read:
          - - op: select
              css: a.c-usernameBlock__displayName span
            - op: text
            - op: trim
      authorAvatar:
        description: Absolute url of the writer's avatar.
        read:
          - - op: select
              css: img.comment_useravatar
            - op: attr
              name: src
            - op: url
      posted:
        description: When the message was left.
        presence: expected
        type: timestamp
        read:
          - - op: select
              css: span.popup_date
            - op: attr
              name: data-time
      body:
        description: The message, as markup rather than text.
        read:
          - - op: select
              css: comment-user-text
            - op: html

  fact:
    feature: user
    description: A question the site asks on a profile, and its answer.
    fields:
      label:
        description: The question, as the site words it.
        presence: required
        read:
          - - op: select
              css: div.userpage-profile-question
            - op: text
            - op: trim
      value:
        description: The answer the member gave.
        presence: required
        read:
          - - op: html
              without: '> div.userpage-profile-question, > div.userpage-profile-question + br'
      group:
        description: |-
          Which block of questions the row sits in. The site separates the
          availability answers from the rest and renders the rest smaller.
        read:
          - - op: select
              css: div.userpage-profile-question
            - op: class
              prefix: font-

  userDocument:
    feature: user
    page: true
    fields:
      user:
        presence: required
        type: user
        at: [body]
      contacts:
        type: contact
        list: true
        at: [div.user-contact-item]
      facts:
        presence: expected
        type: fact
        list: true
        in: ['div#userpage-contact-item']
        at: [div.table-row]
      shouts:
        presence: expected
        type: shout
        list: true
        in: ['section#shout-column']
        at: [div.comment_container]
      gallery:
        type: submissionPreview
        list: true
        at: ['#gallery-latest-submissions figure[id^="sid-"]']
      favorites:
        type: submissionPreview
        list: true
        at: ['#gallery-latest-favorites figure[id^="sid-"]']

  browseDocument:
    feature: submission
    page: true
    fields:
      submissions:
        presence: required
        type: submissionPreview
        list: true
        in: ['section#gallery-browse']
        at: ['figure[id^="sid-"]']
      banner:
        read:
          - - op: select
              css: site-banner picture img
            - op: attr
              name: src
            - op: url

  galleryDocument:
    feature: submission
    description: A main gallery, scraps or folder listing. All three share one layout.
    page: true
    fields:
      submissions:
        presence: required
        type: submissionPreview
        list: true
        in: ['section#gallery-gallery']
        at: ['figure[id^="sid-"]']
      folders:
        type: folderRow
        list: true
        at:
          - div.user-folders a[href*="/folder/"], div.user-folders li.active strong[title]

  favoritesDocument:
    feature: submission
    page: true
    fields:
      favorites:
        presence: required
        type: favorite
        list: true
        in: ['section#gallery-favorites']
        at: ['figure[id^="sid-"]']

  searchDocument:
    feature: submission
    page: true
    fields:
      submissions:
        presence: required
        type: submissionPreview
        list: true
        in: ['div#search-results']
        at: ['section#gallery-search-results > figure[id^="sid-"]']

  frontpageDocument:
    feature: submission
    page: true
    fields:
      submissions:
        type: submissionPreview
        list: true
        at: ['section[id^="gallery-frontpage"] > figure[id^="sid-"]']

  inboxDocument:
    feature: submission
    page: true
    fields:
      submissions:
        type: submissionPreview
        list: true
        at: ['section.gallery > figure[id^="sid-"]']

  viewer:
    feature: identity
    description: Whoever the site thinks is signed in.
    fields:
      name:
        description: |-
          The url form of the name, lowercased and with underscores
          removed.
        presence: required
        read:
          - - op: select
              css: img.loggedin_user_avatar
            - op: attr
              name: alt
            - op: trim
      displayName:
        description: The name as displayed.
        read:
          - - op: select
              css: a#my-username
            - op: text
              own: true
            - op: trim
      avatar:
        description: Absolute url of the avatar.
        read:
          - - op: select
              css: img.loggedin_user_avatar
            - op: attr
              name: src
            - op: url
      submissionAlerts:
        description: How many new submissions are waiting.
        type: int
        read:
          - - op: select
              css: a.notification-container[href="/msg/submissions/"]
            - op: attr
              name: title
            - op: regex
              pattern: ^(\d+)
      watchAlerts:
        description: How many new watchers are waiting.
        type: int
        read:
          - - op: select
              css: a.notification-container[href="/msg/others/#watches"]
            - op: attr
              name: title
            - op: regex
              pattern: ^(\d+)
      commentAlerts:
        description: How many new comments are waiting.
        type: int
        read:
          - - op: select
              css: a.notification-container[href="/msg/others/#comments"]
            - op: attr
              name: title
            - op: regex
              pattern: ^(\d+)
      favouriteAlerts:
        description: How many new favourites are waiting.
        type: int
        read:
          - - op: select
              css: a.notification-container[href="/msg/others/#favorites"]
            - op: attr
              name: title
            - op: regex
              pattern: ^(\d+)
      logoutKey:
        read:
          - - op: select
              css: 'form.logout-link input[name="key"]'
            - op: attr
              name: value

  controlsDocument:
    feature: identity
    page: true
    fields:
      viewer:
        type: viewer
        at: [body]
