name: furlovin_files
description: "Tiny media saving mechanism for furlovin"
version: 0.0.1
publish_to: 'none'

environment:
  sdk: ^3.13.3
  flutter: '>=3.47.4'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: net.clynamic.furlovin_files
        pluginClass: FurlovinFilesPlugin
