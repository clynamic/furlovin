name: furlovin
description: "A FurAffinity client"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.13.3 <4.0.0"
  flutter: ">=3.47.4 <4.0.0"

dependencies:
  app_links: ^7.2.1
  cached_network_image: ^4.0.0
  collection: ^1.19.1
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  dynamic_color: ^2.1.0
  flutter:
    sdk: flutter
  flutter_cache_manager: ^3.4.2
  flutter_inappwebview: 6.2.0-beta.3
  flutter_riverpod: ^3.4.3
  flutter_staggered_grid_view: ^0.7.0
  freezed_annotation: ^3.1.0
  go_router: ^18.0.1
  html: ^0.15.7
  infinite_scroll_pagination: ^5.1.1
  intl: ^0.20.3
  logging: ^1.3.0
  material_ui: ^1.2.0
  meta: ^1.19.0
  mime: ^2.1.0
  native_dio_adapter: ^1.8.0
  package_info_plus: ^10.2.1
  share_plus: ^13.3.0
  shared_preferences: ^2.5.5
  skeletonizer: ^3.0.0
  stack_trace: ^1.12.2
  timeago: ^3.7.1
  url_launcher: ^6.3.2
  yaml: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.16.1
  freezed: ^4.0.1
  drift_dev: ^2.35.0
  flutter_lints: ^6.0.0
  code_builder: ^4.12.0
  dart_style: ^3.1.13
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/rules/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/background.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_monochrome: "assets/icon/monochrome.png"
